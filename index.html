  box(0.09, 0.09, 0.05, 0x222, 0.1, 1.56, -0.26, g);
  g.userData.name = name;
  scene.add(g);
  return g;
}
const player = makeChar(0xff3344, '主人公');
player.position.set(0, 0, 32);

NAMES.forEach(function(nm, i) {
  const g = makeChar(COLS[i], nm);
  g.position.set((i % 4) * 4 - 6, 0, 24 + Math.floor(i / 4) * 3);
  npcs.push({ name: nm, col: COLS[i], g: g, on: i < 5, act: 'walk', wp: i * 2, t: 0, tgt: null, pose: 'idle', i: i });
});

const casts = document.getElementById('casts');
const spk = document.getElementById('spk');
(function uiInit() {
  const o0 = document.createElement('option'); o0.value = '主人公'; o0.textContent = '主人公'; spk.appendChild(o0);
  npcs.forEach(function(n) {
    const row = document.createElement('div'); row.className = 'slot';
    const ck = document.createElement('input'); ck.type = 'checkbox'; ck.checked = n.on;
    ck.onchange = function() {
      const ons = npcs.filter(function(x) { return x.on; }).length;
      if (ck.checked && ons >= 5) { ck.checked = false; return; }
      n.on = ck.checked;
    };
    const lab = document.createElement('span'); lab.textContent = n.name;
    lab.style.color = '#' + n.col.toString(16).padStart(6, '0');
    const sel = document.createElement('select');
    ACTS.forEach(function(a) {
      const o = document.createElement('option'); o.value = a; o.textContent = a; sel.appendChild(o);
    });
    sel.onchange = function() { n.act = sel.value; n.pose = 'idle'; n.t = 0; };
    row.appendChild(ck); row.appendChild(lab); row.appendChild(sel); casts.appendChild(row);
    const op = document.createElement('option'); op.value = n.name; op.textContent = n.name; spk.appendChild(op);
  });
})();

function parsePrompt() {
  const t = document.getElementById('prompt').value;
  const A = npcs.filter(function(n) { return n.on; });
  function all(a) { A.forEach(function(n) { n.act = a; n.pose = 'idle'; }); }
  if (/ループ|周回/.test(t)) return all('loop_walk');
  if (/中央|集ま/.test(t)) return all('gather_center');
  if (/バスケ/.test(t) && /ベンチ/.test(t)) {
    const m = t.match(/(\d+)人/);
    const k = m ? +m[1] : 2;
    A.forEach(function(n, i) { n.act = i < k ? 'basketball' : 'bench'; });
    return;
  }
  if (/バスケ/.test(t)) return all('basketball');
  if (/ベンチ/.test(t)) return all('bench');
  if (/自販/.test(t)) return all('vending');
  if (/走/.test(t)) return all('run');
  if (/座/.test(t)) return all('sit');
  if (/歩/.test(t)) return all('walk');
}
document.getElementById('goP').onclick = parsePrompt;

function bubble(obj, text) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.fillStyle = '#fffef5'; c.strokeStyle = '#222'; c.lineWidth = 6;
  c.beginPath(); c.rect(10, 8, 492, 88); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(48, 96); c.lineTo(28, 122); c.lineTo(72, 96); c.fill();
  c.fillStyle = '#222'; c.font = 'bold 28px sans-serif';
  c.fillText(String(text).slice(0, 20), 28, 62);
  const sm = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), fog: false, depthTest: false });
  const sp = new THREE.Sprite(sm); sp.scale.set(3.2, 0.8, 1); sp.position.y = 2.45;
  obj.add(sp);
  setTimeout(function() { obj.remove(sp); sm.map.dispose(); sm.dispose(); }, 3000);
}
function doSay() {
  const name = spk.value;
  const text = document.getElementById('line').value;
  if (!text) return;
  const obj = name === '主人公' ? player : npcs.find(function(n) { return n.name === name; }).g;
  bubble(obj, text);
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  const log = document.getElementById('log');
  log.innerHTML = log.innerHTML + '<div><b>' + name + '</b> ' + text + '</div>';
  log.scrollTop = 9999;
}
document.getElementById('say').onclick = doSay;

function setMode(m) { mode = m; }
document.getElementById('mF').onclick = function() { setMode('follow'); };
document.getElementById('mR').onclick = function() { setMode('free'); };
document.getElementById('mT').onclick = function() { setMode('top'); };
document.getElementById('fov').oninput = function(e) { cam.fov = +e.target.value; cam.updateProjectionMatrix(); };
document.getElementById('dn').onclick = function() {
  night = !night;
  scene.background = night ? SKY_NIT : SKY_EVE;
  scene.fog.color.set(night ? 0x1a1030 : 0xff9a5c);
  scene.fog.near = night ? 40 : 70; scene.fog.far = night ? 160 : 215;
  hemi.intensity = night ? 0.28 : 1.15;
  sun.intensity = night ? 0.22 : 2.35;
  fill.intensity = night ? 0.15 : 0.35;
  WIN.emissiveIntensity = night ? 1.25 : 0.45;
  renderer.toneMappingExposure = night ? 0.85 : 1.18;
};

window.onkeydown = function(e) {
  keys[e.code] = true;
  if (e.code === 'KeyC') {
    mode = mode === 'follow' ? 'free' : mode === 'free' ? 'top' : 'follow';
  }
  if (e.code === 'KeyE') interact();
};
window.onkeyup = function(e) { keys[e.code] = false; };
window.oncontextmenu = function(e) { e.preventDefault(); };
window.onpointerdown = function(e) { if (e.button === 2) drag = true; };
window.onpointerup = function() { drag = false; };
window.onpointermove = function(e) {
  if (!drag) return;
  yaw -= e.movementX * 0.005;
  pitch = Math.max(-0.08, Math.min(1.15, pitch + e.movementY * 0.005));
};
window.onwheel = function(e) { dist = Math.max(4, Math.min(42, dist + e.deltaY * 0.02)); };
window.onresize = function() {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};

function interact() {
  const pp = player.position;
  if (BALL && pp.distanceTo(BALL.position) < 2.4) {
    BALL.userData.v.set(-Math.sin(yaw) * 8, 3.2, -Math.cos(yaw) * 8);
    return;
  }
  for (let i = 0; i < VENDS.length; i++) {
    const w = new THREE.Vector3(); VENDS[i].getWorldPosition(w);
    if (pp.distanceTo(w) < 2.3) {
      bubble(player, 'カラン');
      VENDS[i].material.emissiveIntensity = 2.2;
      return;
    }
  }
}
function doorW(a, z) { return a.g.localToWorld(new THREE.Vector3(0, 1, z)); }
function checkWarp(dt) {
  warpCd -= dt; if (warpCd > 0) return;
  if (inApt) {
    if (player.position.distanceTo(doorW(inApt, 3.6)) < 1.5) {
      const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(inApt.g.quaternion);
      player.position.copy(doorW(inApt, 5.35)).add(fwd.multiplyScalar(2.6));
      inApt.shell.visible = true; inApt.room.visible = false; inApt = null; warpCd = 1.1;
    }
    return;
  }
  for (let i = 0; i < APTS.length; i++) {
    const a = APTS[i];
    if (player.position.distanceTo(doorW(a, 5.35)) < 1.7) {
      a.shell.visible = false; a.room.visible = true;
      player.position.copy(a.g.position); inApt = a; warpCd = 1.1; break;
    }
  }
}
function cl145(p) {
  p.x = Math.max(-145, Math.min(145, p.x));
  p.z = Math.max(-145, Math.min(145, p.z));
}
function updPlayer(dt) {
  const sp = (keys.ShiftLeft || keys.ShiftRight) ? 9.2 : 4.6;
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (ix || iz) {
    const l = Math.hypot(ix, iz); ix /= l; iz /= l;
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    const dx = fx * iz + rx * ix, dz = fz * iz + rz * ix;
    player.position.x += dx * sp * dt;
    player.position.z += dz * sp * dt;
    player.rotation.y = Math.atan2(dx, dz) + Math.PI;
    player.position.y = Math.abs(Math.sin(T * 14)) * 0.06;
    if (mode === 'follow') {
      let ty = Math.atan2(-dx, -dz), dl = ty - yaw;
      while (dl > Math.PI) dl -= 6.2832; while (dl < -Math.PI) dl += 6.2832;
      yaw += dl * Math.min(1, dt * 3.2);
    }
  } else player.position.y = 0;
  if (inApt) {
    const c = inApt.g.position;
    player.position.x = Math.max(c.x - 3.8, Math.min(c.x + 3.8, player.position.x));
    player.position.z = Math.max(c.z - 3.8, Math.min(c.z + 3.8, player.position.z));
  } else cl145(player.position);
}
function steer(n, tx, tz, sp, dt) {
  const p = n.g.position;
  const dx = tx - p.x, dz = tz - p.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.55) return true;
  p.x += dx / d * sp * dt; p.z += dz / d * sp * dt;
  n.g.rotation.y = Math.atan2(dx, dz) + Math.PI;
  p.y = Math.abs(Math.sin(T * 11 + n.i)) * 0.05;
  cl145(p); n.pose = 'walk';
  return false;
}
function updNpcs(dt) {
  npcs.forEach(function(n) {
    n.g.visible = n.on;
    if (!n.on) return;
    const act = n.act;
    const sp = act === 'run' ? 6.2 : 2.15;
    n.t -= dt;
    if (act === 'loop_walk') {
      const wp = LOOP[n.wp % LOOP.length];
      if (steer(n, wp[0], wp[1], sp, dt)) n.wp++;
    } else if (act === 'gather_center') {
      steer(n, n.i * 1.8 - 6, 12, sp, dt);
    } else if (act === 'bench') {
      const b = BENCH[n.i % BENCH.length];
      if (steer(n, b[0], b[1], sp, dt)) n.pose = 'sit';
    } else if (act === 'vending') {
      const v = VTAR.length ? VTAR[n.i % VTAR.length] : [58, 58];
      steer(n, v[0], v[1], sp, dt);
    } else if (act === 'basketball') {
      if (!n.tgt || n.t < 0) { n.tgt = [(Math.random() - 0.5) * 18, (Math.random() - 0.5) * 12]; n.t = 2 + Math.random() * 2; }
      steer(n, n.tgt[0], n.tgt[1], sp, dt);
    } else if (act === 'sit') n.pose = 'sit';
    else if (act === 'phone') { n.pose = 'idle'; n.g.rotation.y += dt * 0.4; }
    else {
      if (!n.tgt || n.t < 0) { n.tgt = [(Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200]; n.t = 3 + Math.random() * 4; }
      steer(n, n.tgt[0], n.tgt[1], sp, dt);
    }
    n.g.scale.y = n.pose === 'sit' ? 0.62 : 1;
  });
}
function updBall(dt) {
  if (!BALL) return;
  const v = BALL.userData.v;
  v.y -= 18 * dt;
  BALL.position.addScaledVector(v, dt);
  if (BALL.position.y < 0.15) { BALL.position.y = 0.15; v.y *= -0.52; v.x *= 0.82; v.z *= 0.82; }
  cl145(BALL.position);
}
function updCam() {
  const t = player.position;
  sun.target.position.copy(t);
  sun.position.set(t.x + 36, 62, t.z + 24);
  if (mode === 'top') { cam.position.set(t.x, 92, t.z + 0.2); cam.lookAt(t.x, 0, t.z); return; }
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const d = mode === 'free' ? dist : dist;
  cam.position.set(t.x + d * Math.sin(yaw) * cp, t.y + 1.35 + d * sp, t.z + d * Math.cos(yaw) * cp);
  cam.lookAt(t.x, t.y + 1.2, t.z);
}
const MX = document.getElementById('mini');
function drawMini() {
  const c = MX.getContext('2d'); const W = 140, sc = W / 300;
  c.fillStyle = '#152030'; c.fillRect(0, 0, W, W);
  c.strokeStyle = '#667788'; c.lineWidth = 5;
  c.strokeRect((150 - 120) * sc, (150 - 120) * sc, 240 * sc, 240 * sc);
  c.fillStyle = '#e07030'; c.fillRect((150 - 14) * sc, (150 - 9) * sc, 28 * sc, 18 * sc);
  function dot(x, z, col, r) {
    c.fillStyle = col; c.beginPath(); c.arc((x + 150) * sc, (z + 150) * sc, r, 0, 7); c.fill();
  }
  dot(player.position.x, player.position.z, '#ffffff', 3.4);
  npcs.forEach(function(n) {
    if (!n.on) return;
    dot(n.g.position.x, n.g.position.z, '#' + n.col.toString(16).padStart(6, '0'), 2.4);
  });
}
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;
  updPlayer(dt); updNpcs(dt); updBall(dt); checkWarp(dt); updCam(); drawMini();
  renderer.render(scene, cam);
}
loop();
