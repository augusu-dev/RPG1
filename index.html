    const dx = fx * iz + rx * ix, dz = fz * iz + rz * ix;
    player.position.x += dx * sp * dt;
    player.position.z += dz * sp * dt;
    player.rotation.y = Math.atan2(dx, dz) + Math.PI;
    player.position.y = baseY + Math.abs(Math.sin(T * 14)) * 0.06;
    if (mode === 'follow') {
      let ty = Math.atan2(-dx, -dz), dl = ty - yaw;
      while (dl > Math.PI) dl -= 6.2832; while (dl < -Math.PI) dl += 6.2832;
      yaw += dl * Math.min(1, dt * 3.2);
    }
  } else player.position.y = baseY;
  if (inApt) {
    const c = inApt.g.position;
    player.position.x = Math.max(c.x - 3.8, Math.min(c.x + 3.8, player.position.x));
    player.position.z = Math.max(c.z - 3.8, Math.min(c.z + 3.8, player.position.z));
  } else if (inTower) {
    const c = inTower.g.position, hw = inTower.w * 0.42, hd = inTower.d * 0.42;
    player.position.x = Math.max(c.x - hw, Math.min(c.x + hw, player.position.x));
    player.position.z = Math.max(c.z - hd, Math.min(c.z + hd, player.position.z));

}
function steer(n, tx, tz, sp, dt) {
  const p = n.g.position;
  const dx = tx - p.x, dz = tz - p.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.55) return true;
  p.x += dx / d * sp * dt; p.z += dz / d * sp * dt;
  n.g.rotation.y = Math.atan2(dx, dz) + Math.PI;
  p.y = Math.abs(Math.sin(T * 11 + n.i)) * 0.05;
  cl145(p); n.pose = 'walk';
  return false;
}
function updNpcs(dt) {
  npcs.forEach(function(n) {
    n.g.visible = n.on;
    if (!n.on) return;
    const act = n.act;
    const sp = act === 'run' ? 6.2 : 2.15;
    n.t -= dt;
    if (act === 'loop_walk') {
      const wp = LOOP[n.wp % LOOP.length];
      const dd = Math.hypot(n.g.position.x - wp[0], n.g.position.z - wp[1]);
      if (steer(n, wp[0], wp[1], dd > 20 ? 11 : 3.4, dt)) n.wp++;
    } else if (act === 'gather_center') steer(n, n.i * 1.8 - 6, -38, sp, dt);
    else if (act === 'bench') {
      const b = BENCH.length ? BENCH[n.i % BENCH.length] : [0, -28];
      if (steer(n, b[0], b[1], sp, dt)) n.pose = 'sit';
    } else if (act === 'vending') {
      const v = VTAR.length ? VTAR[n.i % VTAR.length] : [52, -18];
      steer(n, v[0], v[1], sp, dt);
    } else if (act === 'basketball') {
      if (!n.tgt || n.t < 0) { n.tgt = [(Math.random() - 0.5) * 16, -38 + (Math.random() - 0.5) * 10]; n.t = 2 + Math.random() * 2; }
      steer(n, n.tgt[0], n.tgt[1], sp, dt);
    } else if (act === 'sit') {
      const s = SEATS[n.i % Math.max(1, SEATS.length)];
      if (s) {
        const w = worldPos(s);
        if (steer(n, w.x, w.z, sp, dt)) sitOn(n.g, s);
      } else n.pose = 'sit';
    } else if (act === 'rooftop') {
      const t = TOWERS[0];
      n.g.position.set(t.g.position.x + n.i * 1.3 - 3, t.roofY, t.g.position.z + 2);
      n.pose = 'sit';
    } else if (act === 'elevator') {
      const t = TOWERS[n.i % TOWERS.length];
      steer(n, t.g.position.x, t.g.position.z + t.doorZ + 2, sp, dt);
    } else if (act === 'phone') { n.pose = 'idle'; n.g.rotation.y += dt * 0.4; }
    else if (act === 'wave') { n.pose = 'idle'; n.g.rotation.z = Math.sin(T * 6) * 0.15; }
    else if (act === 'lean') {
      const t = TOWERS[0];
      if (steer(n, t.g.position.x + t.w * 0.5 + 1, t.g.position.z, sp, dt)) n.g.rotation.x = 0.12;
    } else {
      if (!n.tgt || n.t < 0) { n.tgt = [(Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200]; n.t = 3 + Math.random() * 4; }
      steer(n, n.tgt[0], n.tgt[1], sp, dt);
      n.g.rotation.z = 0;
    }
    if (!n.g.userData.sitting) n.g.scale.y = n.pose === 'sit' ? 0.62 : 1;
  });
}
function updBall(dt) {
  if (!BALL) return;
  const v = BALL.userData.v;
  v.y -= 18 * dt;
  BALL.position.addScaledVector(v, dt);
  if (BALL.position.y < 0.22) { BALL.position.y = 0.22; v.y *= -0.52; v.x *= 0.82; v.z *= 0.82; }
  cl145(BALL.position);
}
function updCam() {
  const t = player.position;
  sun.target.position.copy(t);
  sun.position.set(t.x + 50, Math.max(70, t.y + 40), t.z + 30);
  if (mode === 'top') {
    scene.fog.near = 420; scene.fog.far = 900;
    cam.position.set(t.x, 420, t.z + 0.2); cam.lookAt(t.x, 0, t.z); return;
  }
  if (t.y > 15) { scene.fog.near = 50; scene.fog.far = 420; }
  else if (night) { scene.fog.near = 50; scene.fog.far = 220; }
  else { scene.fog.near = 90; scene.fog.far = 380; }
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  cam.position.set(t.x + dist * Math.sin(yaw) * cp, t.y + 1.35 + dist * sp, t.z + dist * Math.cos(yaw) * cp);
  cam.lookAt(t.x, t.y + 1.2, t.z);
}
const MX = document.getElementById('mini');
function drawMini() {
  const c = MX.getContext('2d'); const W = 140, sc = W / 300;
  c.fillStyle = '#152030'; c.fillRect(0, 0, W, W);
  c.strokeStyle = '#667788'; c.lineWidth = 4;
  c.strokeRect((150 - 120) * sc, (150 - 120) * sc, 240 * sc, 240 * sc);
  c.fillStyle = '#e07030'; c.fillRect((150 - 14) * sc, (-38 + 150 - 9) * sc, 28 * sc, 18 * sc);
  c.fillStyle = '#8ecae6';
  TOWERS.forEach(function(tw) {
    const s = Math.max(3, tw.w * sc * 0.5);
    c.fillRect((tw.g.position.x + 150) * sc - s / 2, (tw.g.position.z + 150) * sc - s / 2, s, s);
  });
  function dot(x, z, col, r) {
    c.fillStyle = col; c.beginPath(); c.arc((x + 150) * sc, (z + 150) * sc, r, 0, 7); c.fill();
  }
  dot(player.position.x, player.position.z, '#ffffff', 3.4);
  npcs.forEach(function(n) {
    if (!n.on) return;
    dot(n.g.position.x, n.g.position.z, '#' + n.col.toString(16).padStart(6, '0'), 2.4);
  });
}
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;
  updPlayer(dt); updNpcs(dt); updBall(dt); checkWarp(dt); updCam(); drawMini();
  renderer.render(scene, cam);
}
loop();
